name: AI Issue Assistant

on:
  workflow_dispatch:
    inputs:
      issue-number:
        description: Issue number to analyze
        required: true
        type: number
  issues:
    types:
      - opened
      - reopened
      - edited
      - labeled
  issue_comment:
    types:
      - created
      - edited

permissions:
  contents: read
  issues: write
  copilot-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    concurrency:
      group: issue-ai-analyze-${{ github.repository }}-${{ github.event.issue.number || inputs.issue-number || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0

      - name: Analyze issue with AI
        uses: mingzaily/issue-ai-analyze@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ inputs.issue-number }}
          label-map-file: ./.github/issue-ai-label-map.yml
          model: gpt-4.1
          language: zh
