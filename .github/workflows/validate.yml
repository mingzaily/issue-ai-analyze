name: Validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 24

      - name: Run behavior tests with coverage
        run: npm test

      - name: Compile embedded github-script programs
        run: |
          # shellcheck disable=SC2016
          ruby -ryaml -rjson -e '
            yaml = YAML.load_file("action.yml")
            scripts = []
            walk = lambda do |value|
              if value.is_a?(Hash)
                value.each do |key, child|
                  scripts << child if key.to_s == "script" && child.is_a?(String)
                  walk.call(child)
                end
              elsif value.is_a?(Array)
                value.each { |child| walk.call(child) }
              end
            end
            walk.call(yaml)
            puts JSON.generate(scripts)
          ' | node -e '
            const vm = require("node:vm");
            let data = "";
            process.stdin.on("data", chunk => data += chunk).on("end", () => {
              const scripts = JSON.parse(data);
              scripts.forEach((script, index) => new vm.Script(`(async function(){\n${script}\n})()`, {
                filename: `action.yml#script-${index + 1}`
              }));
              console.log(`embedded scripts ok (${scripts.length})`);
            });
          '

      - name: Compile extracted action programs
        run: |
          node --check src/core.js
          node --check src/prepare.js
          node --check src/normalize.js
          node --check src/freshness.js
          node --check src/apply-labels.js
          node --check src/finalize.js
          ruby -c src/resolve.rb

  yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0

      - name: Validate YAML files
        run: |
          ruby -e 'require "yaml"; YAML.load_file("action.yml"); YAML.load_file("prompts/general.prompt.yml"); YAML.load_file("examples/issue-analyze.yml"); YAML.load_file("examples/label-map.yml"); YAML.load_file(".github/issue-ai-label-map.yml"); YAML.load_file(".github/workflows/issue.yml"); YAML.load_file(".github/ISSUE_TEMPLATE/bug_report.yml"); YAML.load_file(".github/ISSUE_TEMPLATE/document.yml"); YAML.load_file(".github/ISSUE_TEMPLATE/feature_request.yml"); YAML.load_file(".github/ISSUE_TEMPLATE/question.yml"); YAML.load_file(".github/ISSUE_TEMPLATE/config.yml"); puts "yaml ok"'

      - name: Validate prompt rendering
        run: |
          ruby - <<'RUBY'
          require 'yaml'

          prompt = YAML.load_file('prompts/general.prompt.yml')
          prompt['model'] = 'gpt-4.1'
          resolved = YAML.dump(prompt)

          detect_indent = lambda do |placeholder|
            pattern = /^\s*\{\{#{Regexp.escape(placeholder)}\}\}\s*$/
            line = resolved.each_line.find { |value| value.match?(pattern) }
            line ? line[/^\s*/] : '    '
          end

          format_multiline = lambda do |text, indent|
            String(text)
              .gsub("\r\n", "\n")
              .split("\n")
              .each_with_index
              .map { |line, index| index.zero? ? line : "#{indent}#{line}" }
              .join("\n")
          end

          replacements = {
            '{{trigger_reason}}' => 'Issue title or body changed. Run the initial AI analysis again.',
            '{{issue_title}}' => format_multiline.call("[Test] How should rerun be configured in YAML?\nSecond title line", detect_indent.call('issue_title')),
            '{{current_labels}}' => format_multiline.call("question, needs-info\npriority/high", detect_indent.call('current_labels')),
            '{{issue_body}}' => format_multiline.call("Line 1\n\nLine 3", detect_indent.call('issue_body')),
            '{{recent_comments}}' => format_multiline.call("bot: previous result\nuser: added more context", detect_indent.call('recent_comments')),
            '{{open_issues}}' => format_multiline.call("#12 | Similar question | labels=[question] | body=...", detect_indent.call('open_issues'))
          }

          rendered = replacements.reduce(resolved) { |content, (key, value)| content.gsub(key, value) }
          YAML.safe_load(rendered, aliases: false)
          puts 'prompt render ok'
          RUBY

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version: '1.23.x'
          cache: false

      - name: Lint GitHub workflows
        env:
          GOTOOLCHAIN: local
        run: |
          # actionlint v1.7.7 predates the Copilot "copilot-requests" permission.
          # Keep the explicit compatibility ignore until actionlint recognizes it.
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 \
            -ignore 'unknown permission scope "copilot-requests"' \
            .github/workflows/*.yml
