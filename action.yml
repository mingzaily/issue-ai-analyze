name: Issue AI Analyze
author: mingzaily
description: AI-assisted triage for GitHub issues with label mapping, duplicate hints, and structured comments.
branding:
  icon: tag
  color: blue

inputs:
  github-token:
    description: "GitHub token with issues: write and, for the default Copilot transport, copilot-requests: write permission. In most workflows this is secrets.GITHUB_TOKEN."
    required: true
  issue-number:
    description: Optional issue number for workflow_dispatch or callers without an issue payload.
    required: false
    default: ""
  prompt-file:
    description: Optional custom prompt YAML file. Defaults to prompts/general.prompt.yml.
    required: false
    default: ""
  model:
    description: Optional model override. Leave empty for Copilot to choose its currently available default; legacy openai/<model> names are converted for the Copilot transport. Custom endpoints receive the configured model unchanged.
    required: false
    default: ""
  language:
    description: "Output language for bundled prompt instructions and built-in comments. Supported values: zh, en."
    required: false
    default: "zh"
  label-map:
    description: Optional inline label mapping. Use one key=value entry per line, for example bug=type/bug. Use rerun=ai-rerun,ai-recheck for rerun labels; rerun labels must not overlap mapped AI-managed labels.
    required: false
    default: ""
  label-map-file:
    description: Optional YAML file path for label management config. Supported keys are bug, question, enhancement, documentation, duplicate, needs-info, and rerun. Rerun labels must not overlap mapped AI-managed labels. Takes precedence over label-map.
    required: false
    default: ""
  openai-compatible-endpoint:
    description: Optional OpenAI-compatible endpoint. When set together with the token, the Copilot transport is skipped and the explicit compatibility transport is used.
    required: false
    default: ""
  openai-compatible-token:
    description: Optional token for the OpenAI-compatible endpoint.
    required: false
    default: ""
  openai-compatible-headers:
    description: Optional custom headers forwarded to the OpenAI-compatible inference action.
    required: false
    default: ""
  comment-marker:
    description: Hidden marker used to find the latest AI analysis comment.
    required: false
    default: "<!-- issue-ai-analyze -->"
  ignore-label:
    description: Label that disables AI analysis and label synchronization for the issue. It must not overlap mapped AI-managed or rerun labels. Set empty to disable.
    required: false
    default: "ai-ignore"
  label-management:
    description: Label synchronization policy. Supported values are replace, add-only, and none.
    required: false
    default: "replace"
  recent-comments-limit:
    description: Number of recent comments passed to the model. Must be an integer from 1 to 100.
    required: false
    default: "10"
  open-issues-limit:
    description: Number of open issues included for duplicate detection. Must be an integer from 1 to 100.
    required: false
    default: "50"

outputs:
  should-run:
    description: Whether the current event triggered an analysis run.
    value: ${{ steps.prepare.outputs.should_run }}
  skip-reason:
    description: Reason analysis was skipped when should-run is false.
    value: ${{ steps.prepare.outputs.skip_reason }}
  issue-number:
    description: Issue number selected for this run.
    value: ${{ steps.prepare.outputs.issue_number }}
  ok:
    description: Whether AI normalization succeeded.
    value: ${{ steps.normalize.outputs.ok }}
  result-json:
    description: Normalized analysis result JSON.
    value: ${{ steps.normalize.outputs.json }}
  labels:
    description: JSON array of mapped labels selected by the analysis; label-management may prevent them from being applied.
    value: ${{ steps.normalize.outputs.labels }}
  category:
    description: Normalized category selected by the model.
    value: ${{ steps.normalize.outputs.category }}
  disposition:
    description: Normalized disposition selected by the model.
    value: ${{ steps.normalize.outputs.disposition }}
  needs-info:
    description: Whether the issue still needs more information after normalization.
    value: ${{ steps.normalize.outputs.needs_info }}
  comment-id:
    description: The AI comment ID created or updated during this run.
    value: ${{ steps.prepare.outputs.comment_id }}
  comment-status:
    description: Final comment state, such as analysis, stale, fallback, newer-run, comment-missing, or publish-failed.
    value: ${{ steps.finalize.outputs.comment_status }}
  label-sync-status:
    description: Label synchronization state, such as applied, policy-none, conflict, ignored, stale, failed, or not-applied.
    value: ${{ steps.apply_labels.outputs.status || 'not-applied' }}
  comment-strategy:
    description: Whether this run replaced the latest AI comment or created a new one.
    value: ${{ steps.prepare.outputs.comment_strategy }}
  transport:
    description: "Which inference transport was selected: copilot or openai-compatible."
    value: ${{ steps.resolve.outputs.transport }}
  resolved-model:
    description: Effective model resolved from the prompt file or action defaults. Copilot model names are normalized before this output is written.
    value: ${{ steps.resolve.outputs.resolved_model }}
  resolved-response-format:
    description: Effective response format resolved from the prompt file.
    value: ${{ steps.resolve.outputs.resolved_response_format }}
  resolved-model-parameters:
    description: Effective modelParameters object resolved from the prompt file, serialized as JSON.
    value: ${{ steps.resolve.outputs.resolved_model_parameters_json }}

runs:
  using: composite
  steps:
    - name: Resolve prompt and label map
      id: resolve
      shell: bash
      env:
        INPUT_PROMPT_FILE: ${{ inputs.prompt-file }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_LANGUAGE: ${{ inputs.language }}
        INPUT_LABEL_MAP: ${{ inputs.label-map }}
        INPUT_LABEL_MAP_FILE: ${{ inputs.label-map-file }}
        INPUT_IGNORE_LABEL: ${{ inputs.ignore-label }}
        INPUT_OPENAI_COMPAT_ENDPOINT: ${{ inputs.openai-compatible-endpoint }}
        INPUT_OPENAI_COMPAT_TOKEN: ${{ inputs.openai-compatible-token }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        export RESOLVED_PROMPT_FILE="$RUNNER_TEMP/issue-ai-analyze-prompt-${GITHUB_RUN_ID}-${GITHUB_ACTION}.prompt.yml"
        ruby "$ACTION_PATH/src/resolve.rb"
    - name: Log resolved inference config
      shell: bash
      run: |
        echo "Resolved inference config:"
        echo "- transport: ${{ steps.resolve.outputs.transport }}"
        echo "- prompt file: ${{ steps.resolve.outputs.resolved_prompt_file }}"
        echo "- model: ${{ steps.resolve.outputs.resolved_model }}"
        echo "- response format: ${{ steps.resolve.outputs.resolved_response_format || 'none' }}"
        echo "- model parameters: ${{ steps.resolve.outputs.resolved_model_parameters_json }}"

    - name: Prepare issue context and pending comment
      id: prepare
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        INPUT_ISSUE_NUMBER: ${{ inputs.issue-number }}
        LABEL_MAP_JSON: ${{ steps.resolve.outputs.label_map_json }}
        LANGUAGE_PROFILE_JSON: ${{ steps.resolve.outputs.language_profile_json }}
        RERUN_LABELS_JSON: ${{ steps.resolve.outputs.rerun_labels_json }}
        FILE_INPUT_INDENT_JSON: ${{ steps.resolve.outputs.file_input_indent_json }}
        COMMENT_MARKER: ${{ inputs.comment-marker }}
        IGNORE_LABEL: ${{ inputs.ignore-label }}
        LABEL_MANAGEMENT: ${{ inputs.label-management }}
        RECENT_COMMENTS_LIMIT: ${{ inputs.recent-comments-limit }}
        OPEN_ISSUES_LIMIT: ${{ inputs.open-issues-limit }}
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const path = require('path');
          const run = require(path.join(process.env.ACTION_PATH, 'src', 'prepare.js'));
          await run({ github, context, core });

    - name: Skip irrelevant event
      if: ${{ steps.prepare.outputs.should_run != 'true' }}
      shell: bash
      run: echo "issue analysis skipped for this event."

    - name: Set up Node.js for GitHub Copilot CLI
      if: ${{ steps.prepare.outputs.should_run == 'true' && steps.resolve.outputs.use_custom_endpoint != 'true' }}
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
      with:
        node-version: 24

    - name: Install GitHub Copilot CLI
      if: ${{ steps.prepare.outputs.should_run == 'true' && steps.resolve.outputs.use_custom_endpoint != 'true' }}
      id: install_copilot
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        npm install --global --no-audit --no-fund @github/copilot@latest
        copilot --version

    - name: Run AI inference with OpenAI-compatible endpoint
      if: ${{ steps.prepare.outputs.should_run == 'true' && steps.resolve.outputs.use_custom_endpoint == 'true' }}
      id: inference_custom
      continue-on-error: true
      uses: actions/ai-inference@b81b2afb8390ee6839b494a404766bef6493c7d9 # v1
      with:
        prompt-file: ${{ steps.resolve.outputs.resolved_prompt_file }}
        input: |
          trigger_reason: |
            ${{ steps.prepare.outputs.trigger_reason }}
        file_input: |
          issue_title: ${{ steps.prepare.outputs.issue_title_file }}
          current_labels: ${{ steps.prepare.outputs.current_labels_file }}
          issue_body: ${{ steps.prepare.outputs.issue_body_file }}
          recent_comments: ${{ steps.prepare.outputs.recent_comments_file }}
          open_issues: ${{ steps.prepare.outputs.open_issues_file }}
        endpoint: ${{ inputs.openai-compatible-endpoint }}
        token: ${{ inputs.openai-compatible-token }}
        custom-headers: ${{ inputs.openai-compatible-headers }}

    - name: Run AI inference with GitHub Copilot CLI
      if: ${{ steps.prepare.outputs.should_run == 'true' && steps.resolve.outputs.use_custom_endpoint != 'true' && steps.install_copilot.outcome == 'success' }}
      id: inference_copilot
      continue-on-error: true
      uses: actions/ai-inference@2c43c91ae16266ca159d311430343c67a5ffa222 # v3.0.0
      with:
        prompt-file: ${{ steps.resolve.outputs.resolved_prompt_file }}
        input: |
          trigger_reason: |
            ${{ steps.prepare.outputs.trigger_reason }}
        file_input: |
          issue_title: ${{ steps.prepare.outputs.issue_title_file }}
          current_labels: ${{ steps.prepare.outputs.current_labels_file }}
          issue_body: ${{ steps.prepare.outputs.issue_body_file }}
          recent_comments: ${{ steps.prepare.outputs.recent_comments_file }}
          open_issues: ${{ steps.prepare.outputs.open_issues_file }}
        model: ${{ steps.resolve.outputs.resolved_model }}
        provider: copilot
        token: ${{ inputs.github-token }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Normalize AI result
      if: ${{ steps.prepare.outputs.should_run == 'true' }}
      id: normalize
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        AI_RESPONSE_FILE: ${{ steps.inference_custom.outputs.response-file || steps.inference_copilot.outputs.response-file }}
        OPEN_ISSUE_NUMBERS: ${{ steps.prepare.outputs.open_issue_numbers }}
        LABEL_MAP_JSON: ${{ steps.resolve.outputs.label_map_json }}
        LANGUAGE_PROFILE_JSON: ${{ steps.resolve.outputs.language_profile_json }}
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const path = require('path');
          const run = require(path.join(process.env.ACTION_PATH, 'src', 'normalize.js'));
          await run({ github, context, core });

    - name: Check issue freshness
      if: ${{ steps.prepare.outputs.should_run == 'true' && steps.normalize.outputs.ok == 'true' }}
      id: freshness
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        ISSUE_NUMBER: ${{ steps.prepare.outputs.issue_number }}
        ISSUE_FINGERPRINT: ${{ steps.prepare.outputs.issue_fingerprint }}
        DISCUSSION_FINGERPRINT: ${{ steps.prepare.outputs.discussion_fingerprint }}
        RECENT_COMMENTS_LIMIT: ${{ inputs.recent-comments-limit }}
        COMMENT_MARKER: ${{ inputs.comment-marker }}
        IGNORE_LABEL: ${{ inputs.ignore-label }}
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const path = require('path');
          const run = require(path.join(process.env.ACTION_PATH, 'src', 'freshness.js'));
          await run({ github, context, core });

    - name: Apply analysis labels
      if: ${{ steps.prepare.outputs.should_run == 'true' && steps.normalize.outputs.ok == 'true' && steps.freshness.outputs.ok == 'true' }}
      id: apply_labels
      continue-on-error: true
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        TRIAGE_RESULT: ${{ steps.normalize.outputs.json }}
        LABEL_MAP_JSON: ${{ steps.resolve.outputs.label_map_json }}
        ISSUE_NUMBER: ${{ steps.prepare.outputs.issue_number }}
        ISSUE_FINGERPRINT: ${{ steps.prepare.outputs.issue_fingerprint }}
        MANAGED_LABEL_FINGERPRINT: ${{ steps.prepare.outputs.managed_label_fingerprint }}
        PREVIOUS_MANAGED_LABELS: ${{ steps.prepare.outputs.previous_managed_labels }}
        COMMENT_ID: ${{ steps.prepare.outputs.comment_id }}
        RUN_MARKER: ${{ steps.prepare.outputs.run_marker }}
        IGNORE_LABEL: ${{ inputs.ignore-label }}
        LABEL_MANAGEMENT: ${{ inputs.label-management }}
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const path = require('path');
          const run = require(path.join(process.env.ACTION_PATH, 'src', 'apply-labels.js'));
          await run({ github, context, core });

    - name: Finalize AI analysis comment
      id: finalize
      if: ${{ always() && steps.prepare.outputs.should_run == 'true' }}
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        COMMENT_ID: ${{ steps.prepare.outputs.comment_id }}
        TRIAGE_RESULT: ${{ steps.normalize.outputs.json }}
        NORMALIZE_OK: ${{ steps.normalize.outputs.ok }}
        NORMALIZE_ERROR: ${{ steps.normalize.outputs.error }}
        FRESHNESS_OK: ${{ steps.freshness.outputs.ok }}
        FRESHNESS_REASON: ${{ steps.freshness.outputs.reason }}
        LABEL_SYNC_STATUS: ${{ steps.apply_labels.outputs.status }}
        MANAGED_LABELS: ${{ steps.apply_labels.outputs.managed_labels }}
        PREVIOUS_MANAGED_LABELS: ${{ steps.prepare.outputs.previous_managed_labels }}
        DISCUSSION_FINGERPRINT: ${{ steps.prepare.outputs.discussion_fingerprint }}
        RECENT_COMMENTS_LIMIT: ${{ inputs.recent-comments-limit }}
        INFERENCE_CUSTOM_OUTCOME: ${{ steps.inference_custom.outcome }}
        INFERENCE_COPILOT_OUTCOME: ${{ steps.inference_copilot.outcome }}
        COPILOT_INSTALL_OUTCOME: ${{ steps.install_copilot.outcome }}
        TRANSPORT: ${{ steps.resolve.outputs.transport }}
        JOB_STATUS: ${{ job.status }}
        LANGUAGE_PROFILE_JSON: ${{ steps.resolve.outputs.language_profile_json }}
        RERUN_LABELS_JSON: ${{ steps.resolve.outputs.rerun_labels_json }}
        COMMENT_MARKER: ${{ inputs.comment-marker }}
        RUN_MARKER: ${{ steps.prepare.outputs.run_marker }}
        ISSUE_NUMBER: ${{ steps.prepare.outputs.issue_number }}
        ISSUE_FINGERPRINT: ${{ steps.prepare.outputs.issue_fingerprint }}
        IGNORE_LABEL: ${{ inputs.ignore-label }}
        LABEL_MANAGEMENT: ${{ inputs.label-management }}
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const path = require('path');
          const run = require(path.join(process.env.ACTION_PATH, 'src', 'finalize.js'));
          await run({ github, context, core });
